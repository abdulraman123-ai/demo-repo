name: Build Axion Live Wallpaper APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Download wallpaper video
        run: |
          mkdir -p app/src/main/res/raw
          curl -fL "https://media.base44.com/videos/public/6af3aceb57b719502d626229/5a36aadcd_axion_wallpaper.mp4" -o app/src/main/res/raw/axion_wallpaper.mp4
          test -s app/src/main/res/raw/axion_wallpaper.mp4
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Axion-Live-Wallpaper-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
